server {
    listen 80;
    listen [::]:80;
    server_name pimanager.cn www.pimanager.cn;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pimanager.cn www.pimanager.cn;

    ssl_certificate /etc/letsencrypt/live/pimanager.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pimanager.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:PIManagerTLS:10m;

    client_max_body_size 32m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Public UI assets contain no customer or financial information. Serving
    # them directly avoids application-worker work and repeated downloads.
    location /static/ {
        alias /opt/pi-manager/current/static/;
        expires 1h;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
