<div class="mb-3">
    <label class="form-label" for="contact_id">订单联系人</label>
    <select class="form-select" id="contact_id" name="contact_id"
            data-original-customer="{{ pi.customer_id if pi else '' }}"
            data-selected="{{ '__snapshot__' if pi else ((draft_data or {}).get('fields', {}).get('contact_id', '')) }}"
            data-snapshot="{{ (pi.contact_info if pi else {})|tojson|forceescape }}">
        <option value="">自动选择默认联系人</option>
    </select>
    <div class="form-text" id="piContactSummary"></div>
</div>
