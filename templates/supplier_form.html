{% extends "base.html" %}
{% block title %}{% if editing %}编辑{% else %}新增{% endif %}供应商{% endblock %}

{% block content %}
<div class="row mb-3">
    <div class="col">
        <h2><i class="bi bi-{% if editing %}pencil{% else %}plus-square{% endif %} me-2"></i>
            {% if editing %}编辑供应商{% else %}新增供应商{% endif %}
        </h2>
        <a href="{{ url_for('supplier_list') }}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i> 返回供应商列表</a>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="name" class="form-label">供应商名称 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="name" name="name" required value="{{ s.name if s else '' }}" placeholder="例如：深圳华强电子">
                </div>
                <div class="col-md-6">
                    <label for="contact_person" class="form-label">联系人</label>
                    <input type="text" class="form-control" id="contact_person" name="contact_person" value="{{ s.contact_person if s else '' }}">
                </div>
                <div class="col-md-6">
                    <label for="phone" class="form-label">电话</label>
                    <input type="text" class="form-control" id="phone" name="phone" value="{{ s.phone if s else '' }}">
                </div>
                <div class="col-md-6">
                    <label for="email" class="form-label">邮箱</label>
                    <input type="text" class="form-control" id="email" name="email" value="{{ s.email if s else '' }}">
                </div>
                <div class="col-12">
                    <label for="address" class="form-label">地址</label>
                    <textarea class="form-control" id="address" name="address" rows="2">{{ s.address if s else '' }}</textarea>
                </div>
                <div class="col-12">
                    <label for="notes" class="form-label">备注</label>
                    <textarea class="form-control" id="notes" name="notes" rows="2">{{ s.notes if s else '' }}</textarea>
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-success"><i class="bi bi-check-lg"></i> {% if editing %}更新{% else %}保存{% endif %}供应商</button>
                <a href="{{ url_for('supplier_list') }}" class="btn btn-outline-secondary ms-2">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
